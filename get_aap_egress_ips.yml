# ----------------------------------------------------------------
        # 1. Discover the AAP EC2 instances (Native Module)
        # ----------------------------------------------------------------
        - name: Get EC2 instances for {{ instance_name }}
          amazon.aws.ec2_instance_info:
            region: "{{ instance_region }}"
            filters:
              "tag:Name": "{{ instance_name }}*"
              "instance-state-name": "running"
          register: ec2_instances_raw

        - name: Set fact for EC2 instances
          ansible.builtin.set_fact:
            ec2_instances: >-
              {{
                ec2_instances_raw.instances 
                | map('combine', {
                    'InstanceId': 'instance_id',
                    'PrivateIp': 'private_ip_address',
                    'PublicIp': 'public_ip_address' | default(none),
                    'SubnetId': 'subnet_id',
                    'VpcId': 'vpc_id',
                    'Name': ('tags' | selectattr('Key', 'equalto', 'Name') | map(attribute='Value') | first | default(''))
                })
                | list
              }}

        - name: Fail if no running instances found for {{ instance_name }}
          ansible.builtin.fail:
            msg: >
              No running EC2 instances found with tag Name matching '{{ instance_name }}*'
              in region {{ instance_region }} / account {{ cloud_account_id }}.
          when: ec2_instances | length == 0

        # ----------------------------------------------------------------
        # 2. Check for Elastic IPs associated with the instances (Native Module)
        # ----------------------------------------------------------------
        - name: Get Elastic IPs for {{ instance_name }}
          amazon.aws.ec2_eip_info:
            region: "{{ instance_region }}"
            filters:
              instance-id: "{{ ec2_instances | map(attribute='InstanceId') | list }}"
          register: eip_raw

        - name: Set fact for Elastic IPs
          ansible.builtin.set_fact:
            elastic_ips: >-
              {{
                eip_raw.addresses 
                | map('combine', {'InstanceId': 'instance_id', 'PublicIp': 'public_ip', 'AllocationId': 'allocation_id'})
                | list
              }}

        # ----------------------------------------------------------------
        # 3. Discover NAT Gateways in the instance VPCs (Native Module)
        # ----------------------------------------------------------------
        - name: Set unique VPC IDs from instances
          ansible.builtin.set_fact:
            vpc_ids: "{{ ec2_instances | map(attribute='VpcId') | unique | list }}"

        - name: Get NAT Gateways in instance VPCs
          amazon.aws.ec2_vpc_nat_gateway_info:
            region: "{{ instance_region }}"
            filters:
              vpc-id: "{{ vpc_ids }}"
              state: "available"
          register: nat_gw_raw

        - name: Set fact for NAT Gateways
          ansible.builtin.set_fact:
            nat_gateways: >-
              {{
                nat_gw_raw.nat_gateways
                | map('combine', {
                    'NatGatewayId': 'nat_gateway_id',
                    'VpcId': 'vpc_id',
                    'SubnetId': 'subnet_id',
                    'PublicIp': 'nat_gateway_addresses[0].public_ip',
                    'PrivateIp': 'nat_gateway_addresses[0].private_ip'
                })
                | list
              }}

        # ----------------------------------------------------------------
        # 4. Check route tables to identify NAT-routed subnets (Native Module)
        # ----------------------------------------------------------------
        - name: Set unique subnet IDs from instances
          ansible.builtin.set_fact:
            subnet_ids: "{{ ec2_instances | map(attribute='SubnetId') | unique | list }}"

        - name: Get route tables for instance subnets
          amazon.aws.ec2_vpc_route_table_info:
            region: "{{ instance_region }}"
            filters:
              "association.subnet-id": "{{ subnet_ids }}"
          register: route_tables_raw

        - name: Set fact for route tables
          ansible.builtin.set_fact:
            route_tables: >-
              {{
                route_tables_raw.route_tables
                | map('combine', {
                    'RouteTableId': 'route_table_id',
                    'SubnetId': 'associations[0].subnet_id',
                    'NatGatewayId': ('routes' | selectattr('nat_gateway_id', 'defined') | map(attribute='nat_gateway_id') | first | default(none))
                })
                | list
              }}

        - name: Set NAT-routed subnet IDs
          ansible.builtin.set_fact:
            nat_routed_subnets: >-
              {{
                route_tables
                | selectattr('NatGatewayId', 'ne', None)
                | map(attribute='SubnetId')
                | list
              }}
