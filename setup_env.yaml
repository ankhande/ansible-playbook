---
- name: Configure Linux Environment on Remote Server
  hosts: all
  become: false
  vars:
    user_home: "{{ ansible_env.HOME }}"
    bin_dir: "{{ ansible_env.HOME }}/bin"
    venv_dir: "{{ ansible_env.HOME }}/venv"

  tasks:

    # ─── 1. Create ~/bin and add to PATH ───────────────────────────────────────

    - name: Create ~/bin directory
      file:
        path: "{{ bin_dir }}"
        state: directory
        mode: '0755'

    - name: Add ~/bin to PATH in ~/.bashrc
      lineinfile:
        path: "{{ user_home }}/.bashrc"
        line: 'export PATH="$HOME/bin:$PATH"'
        state: present
        create: yes

    - name: Add ~/bin to PATH in ~/.bash_profile
      lineinfile:
        path: "{{ user_home }}/.bash_profile"
        line: 'export PATH="$HOME/bin:$PATH"'
        state: present
        create: yes

    # ─── 2. Create virtual environment and install Ansible + collections ───────

    - name: Install python3-venv (requires sudo)
      become: true
      apt:
        name:
          - python3-venv
          - python3-pip
        state: present
        update_cache: yes

    - name: Create Python virtual environment
      command: python3 -m venv {{ venv_dir }}
      args:
        creates: "{{ venv_dir }}/bin/activate"

    - name: Install Ansible inside virtual environment
      pip:
        name:
          - ansible
          - pip
        state: latest
        virtualenv: "{{ venv_dir }}"

    - name: Install Ansible collections
      command: "{{ venv_dir }}/bin/ansible-galaxy collection install {{ item }}"
      loop:
        - kubernetes.core
        - azure.azcollection
        - community.general
      register: collection_result
      changed_when: "'was installed' in collection_result.stdout"

    - name: Add venv activate to ~/.bashrc
      lineinfile:
        path: "{{ user_home }}/.bashrc"
        line: 'source {{ venv_dir }}/bin/activate'
        state: present

    # ─── 3. Create alias "k" for kubectl ───────────────────────────────────────

    - name: Add kubectl alias to ~/.bashrc
      lineinfile:
        path: "{{ user_home }}/.bashrc"
        line: "alias k='kubectl'"
        state: present

    - name: Add kubectl alias to ~/.bash_profile
      lineinfile:
        path: "{{ user_home }}/.bash_profile"
        line: "alias k='kubectl'"
        state: present

    - name: Done
      debug:
        msg: "Environment configured! Run 'source ~/.bashrc' to apply changes."
